[project]
name = "connectpak"
version = "0.1.1"
description = "Read-only MCP database connectors for LLMs: one self-contained package and command for 24 engines (SQL, NoSQL, graph, vector)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.34",
    "cassandra-driver>=3.29",
    "chromadb>=0.5",
    "clickhouse-connect>=0.7",
    "databricks-sql-connector>=3.1",
    "elasticsearch>=8.13",
    "google-cloud-bigquery>=3.20",
    "gremlinpython>=3.7",
    "mcp>=1.0,<2",
    "neo4j>=5.20",
    "oracledb>=2.0",
    "pinecone>=4.0",
    "psycopg[binary]>=3.1",
    "pymilvus>=2.4",
    "pymongo>=4.7",
    "pymssql>=2.3",
    "PyMySQL>=1.1",
    "python-arango>=8.0",
    "qdrant-client>=1.9",
    "redshift-connector>=2.1",
    "snowflake-connector-python>=3.7",
    "sqlglot>=23.0",
    "weaviate-client>=4.6",
]

[project.scripts]
connectpak = "connectpak.launcher.__main__:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
