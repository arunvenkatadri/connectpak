[project]
name = "connectpak-workspace"
version = "0.1.0"
description = "MCP-native database connectors for LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
connectpak-core = { workspace = true }
connectpak-sql-postgres = { workspace = true }
connectpak-sql-mysql = { workspace = true }
connectpak-sql-sqlite = { workspace = true }
connectpak-sql-sqlserver = { workspace = true }
connectpak-sql-oracle = { workspace = true }
connectpak-sql-bigquery = { workspace = true }
connectpak-sql-snowflake = { workspace = true }
connectpak-sql-redshift = { workspace = true }
connectpak-sql-databricks = { workspace = true }
connectpak-sql-clickhouse = { workspace = true }
connectpak-nosql-cassandra = { workspace = true }
connectpak-nosql-elasticsearch = { workspace = true }
connectpak-nosql-mongodb = { workspace = true }
connectpak-nosql-dynamodb = { workspace = true }
connectpak-graph-neo4j = { workspace = true }
connectpak-graph-neptune = { workspace = true }
connectpak-graph-arangodb = { workspace = true }
connectpak-graph-memgraph = { workspace = true }
connectpak-vector-pgvector = { workspace = true }
connectpak-vector-pinecone = { workspace = true }
connectpak-vector-weaviate = { workspace = true }
connectpak-vector-qdrant = { workspace = true }
connectpak-vector-chroma = { workspace = true }
connectpak-vector-milvus = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "connectpak-core",
    "connectpak-sql-postgres",
    "connectpak-sql-sqlite",
    "connectpak-sql-mysql",
    "connectpak-sql-clickhouse",
    "connectpak-sql-sqlserver",
    "connectpak-sql-oracle",
    "connectpak-sql-bigquery",
    "connectpak-sql-snowflake",
    "connectpak-sql-redshift",
    "connectpak-sql-databricks",
    "connectpak-nosql-mongodb",
    "connectpak-nosql-dynamodb",
    "connectpak-nosql-elasticsearch",
    "connectpak-nosql-cassandra",
    "connectpak-graph-neo4j",
    "connectpak-graph-memgraph",
    "connectpak-graph-arangodb",
    "connectpak-graph-neptune",
    "connectpak-vector-pgvector",
    "connectpak-vector-pinecone",
    "connectpak-vector-weaviate",
    "connectpak-vector-qdrant",
    "connectpak-vector-chroma",
    "connectpak-vector-milvus",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
