[project]
name = "connectpak-vector-qdrant"
version = "0.1.1"
description = "Qdrant connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "qdrant-client>=1.9",
]

[project.scripts]
connectpak-vector-qdrant = "connectpak.vector.qdrant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
