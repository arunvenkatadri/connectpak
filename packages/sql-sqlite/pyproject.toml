[project]
name = "connectpak-sql-sqlite"
version = "0.1.0"
description = "SQLite connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
]

[project.scripts]
connectpak-sql-sqlite = "connectpak.sql.sqlite.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
