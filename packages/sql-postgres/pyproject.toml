[project]
name = "connectpak-sql-postgres"
version = "0.1.1"
description = "Postgres connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "psycopg[binary]>=3.1",
]

[project.scripts]
connectpak-sql-postgres = "connectpak.sql.postgres.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
