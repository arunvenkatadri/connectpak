[project]
name = "connectpak-vector-milvus"
version = "0.1.0"
description = "Milvus connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "pymilvus>=2.4",
]

[project.scripts]
connectpak-vector-milvus = "connectpak.vector.milvus.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
