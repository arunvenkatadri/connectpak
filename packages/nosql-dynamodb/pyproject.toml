[project]
name = "connectpak-nosql-dynamodb"
version = "0.1.0"
description = "DynamoDB connector for connectpak (stub — not yet implemented)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "boto3>=1.34",
]

[project.scripts]
connectpak-nosql-dynamodb = "connectpak.nosql.dynamodb.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
