[project]
name = "connectpak-nosql-mongodb"
version = "0.1.0"
description = "MongoDB connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "pymongo>=4.7",
]

[project.scripts]
connectpak-nosql-mongodb = "connectpak.nosql.mongodb.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
