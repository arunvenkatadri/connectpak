[project]
name = "connectpak-sql-mysql"
version = "0.1.0"
description = "MySQL connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "PyMySQL>=1.1",
]

[project.scripts]
connectpak-sql-mysql = "connectpak.sql.mysql.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
