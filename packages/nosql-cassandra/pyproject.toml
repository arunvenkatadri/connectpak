[project]
name = "connectpak-nosql-cassandra"
version = "0.1.0"
description = "Cassandra connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "cassandra-driver>=3.29",
]

[project.scripts]
connectpak-nosql-cassandra = "connectpak.nosql.cassandra.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
