[project]
name = "connectpak-sql-clickhouse"
version = "0.1.1"
description = "ClickHouse connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "clickhouse-connect>=0.7",
]

[project.scripts]
connectpak-sql-clickhouse = "connectpak.sql.clickhouse.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
