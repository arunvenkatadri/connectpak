[project]
name = "connectpak-graph-neptune"
version = "0.1.0"
description = "Amazon Neptune connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "gremlinpython>=3.7",
]

[project.scripts]
connectpak-graph-neptune = "connectpak.graph.neptune.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
