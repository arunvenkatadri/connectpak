[project]
name = "connectpak"
version = "0.1.0"
description = "Read-only MCP database connectors for LLMs: one command for 24 engines (SQL, NoSQL, graph, vector)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "llm", "database", "read-only", "claude-code", "codex"]
dependencies = [
    "connectpak-core==0.1.0",
    "connectpak-graph-arangodb==0.1.0",
    "connectpak-graph-memgraph==0.1.0",
    "connectpak-graph-neo4j==0.1.0",
    "connectpak-graph-neptune==0.1.0",
    "connectpak-nosql-cassandra==0.1.0",
    "connectpak-nosql-dynamodb==0.1.0",
    "connectpak-nosql-elasticsearch==0.1.0",
    "connectpak-nosql-mongodb==0.1.0",
    "connectpak-sql-bigquery==0.1.0",
    "connectpak-sql-clickhouse==0.1.0",
    "connectpak-sql-databricks==0.1.0",
    "connectpak-sql-mysql==0.1.0",
    "connectpak-sql-oracle==0.1.0",
    "connectpak-sql-postgres==0.1.0",
    "connectpak-sql-redshift==0.1.0",
    "connectpak-sql-snowflake==0.1.0",
    "connectpak-sql-sqlite==0.1.0",
    "connectpak-sql-sqlserver==0.1.0",
    "connectpak-vector-chroma==0.1.0",
    "connectpak-vector-milvus==0.1.0",
    "connectpak-vector-pgvector==0.1.0",
    "connectpak-vector-pinecone==0.1.0",
    "connectpak-vector-qdrant==0.1.0",
    "connectpak-vector-weaviate==0.1.0",
]

[project.urls]
Homepage = "https://github.com/arunvenkatadri/connectpak"
Repository = "https://github.com/arunvenkatadri/connectpak"

[project.scripts]
connectpak = "connectpak.launcher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
