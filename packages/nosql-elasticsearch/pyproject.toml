[project]
name = "connectpak-nosql-elasticsearch"
version = "0.1.0"
description = "Elasticsearch connector for connectpak (stub — not yet implemented)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "elasticsearch>=8.13",
]

[project.scripts]
connectpak-nosql-elasticsearch = "connectpak.nosql.elasticsearch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
