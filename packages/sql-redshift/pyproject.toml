[project]
name = "connectpak-sql-redshift"
version = "0.1.0"
description = "Redshift connector for connectpak (stub — not yet implemented)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "redshift-connector>=2.1",
]

[project.scripts]
connectpak-sql-redshift = "connectpak.sql.redshift.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
