[project]
name = "connectpak-sql-sqlserver"
version = "0.1.0"
description = "SQL Server connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "pymssql>=2.3",
]

[project.scripts]
connectpak-sql-sqlserver = "connectpak.sql.sqlserver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
