[project]
name = "connectpak-sql-databricks"
version = "0.1.0"
description = "Databricks connector for connectpak (stub — not yet implemented)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "databricks-sql-connector>=3.1",
]

[project.scripts]
connectpak-sql-databricks = "connectpak.sql.databricks.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
