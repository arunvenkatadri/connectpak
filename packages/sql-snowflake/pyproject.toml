[project]
name = "connectpak-sql-snowflake"
version = "0.1.0"
description = "Snowflake connector for connectpak (stub — not yet implemented)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "snowflake-connector-python>=3.7",
]

[project.scripts]
connectpak-sql-snowflake = "connectpak.sql.snowflake.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
