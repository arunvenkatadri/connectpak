[project]
name = "connectpak-sql-bigquery"
version = "0.1.0"
description = "BigQuery connector for connectpak (stub — not yet implemented)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "google-cloud-bigquery>=3.20",
]

[project.scripts]
connectpak-sql-bigquery = "connectpak.sql.bigquery.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
