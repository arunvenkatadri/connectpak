[project]
name = "connectpak-vector-chroma"
version = "0.1.0"
description = "Chroma connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "chromadb>=0.5",
]

[project.scripts]
connectpak-vector-chroma = "connectpak.vector.chroma.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
