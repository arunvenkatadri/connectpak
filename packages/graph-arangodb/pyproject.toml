[project]
name = "connectpak-graph-arangodb"
version = "0.1.0"
description = "ArangoDB connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "python-arango>=8.0",
]

[project.scripts]
connectpak-graph-arangodb = "connectpak.graph.arangodb.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
