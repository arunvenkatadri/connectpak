[project]
name = "connectpak-graph-memgraph"
version = "0.1.0"
description = "Memgraph connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "connectpak-graph-neo4j",
    "neo4j>=5.20",
]

[project.scripts]
connectpak-graph-memgraph = "connectpak.graph.memgraph.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
