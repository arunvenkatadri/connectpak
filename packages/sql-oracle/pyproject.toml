[project]
name = "connectpak-sql-oracle"
version = "0.1.0"
description = "Oracle connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "oracledb>=2.0",
]

[project.scripts]
connectpak-sql-oracle = "connectpak.sql.oracle.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
