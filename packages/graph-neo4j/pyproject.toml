[project]
name = "connectpak-graph-neo4j"
version = "0.1.0"
description = "Neo4j connector for connectpak (stub — not yet implemented)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "neo4j>=5.20",
]

[project.scripts]
connectpak-graph-neo4j = "connectpak.graph.neo4j.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
