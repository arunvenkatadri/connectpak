[project]
name = "connectpak-core"
version = "0.1.0"
description = "Core BaseConnector, read-only SQL guard, and MCP server runner for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlglot>=23.0",
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
