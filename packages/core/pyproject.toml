[project]
name = "connectpak-core"
version = "0.1.0"
description = "Core BaseConnector, read-only SQL guard, and MCP server runner for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlglot>=23.0",
    # mcp 2.x renamed FastMCP → MCPServer; server.py targets the 1.x API.
    "mcp>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
