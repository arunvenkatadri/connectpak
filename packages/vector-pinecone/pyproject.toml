[project]
name = "connectpak-vector-pinecone"
version = "0.1.0"
description = "Pinecone connector for connectpak."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "connectpak-core",
    "pinecone>=4.0",
]

[project.scripts]
connectpak-vector-pinecone = "connectpak.vector.pinecone.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connectpak"]
